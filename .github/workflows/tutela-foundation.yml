name: Tutela Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate required Tutela artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f requirements/TUTELA-REQUIREMENTS.md
          test -f security/SECURITY-PROFILE.md
          test -f security/PROVENANCE-AUTHORITY.json
          test -f security/TRUST-ROOT-CHANGE.json
          test -f security/ROLE-REGISTRY.json
          test -f schemas/security-invariant.schema.json
          test -f schemas/threat.schema.json
          test -f schemas/evidence.schema.json
          test -f schemas/security-assessment.schema.json
          test -f schemas/exception.schema.json
          test -f docs/RESULTS-UI.md
          test -f security/SENSITIVE-DATA-RULES.json
          test -f schemas/verification-result.schema.json
          test -f docs/VERIFICATION-CONTRACT.md
          test -f docs/decisions/0001-gate-authority.md
          test -f requirements/TRACEABILITY-BASELINE.json
          python -m json.tool security/SENSITIVE-DATA-RULES.json >/dev/null
          python -m json.tool requirements/TRACEABILITY-BASELINE.json >/dev/null
          python -m json.tool tests/parity/corpus.json >/dev/null
          python -m json.tool .echelon/tutela.json >/dev/null
          python -m json.tool security/PROVENANCE-AUTHORITY.json >/dev/null
          python -m json.tool security/TRUST-ROOT-CHANGE.json >/dev/null
          python -m json.tool security/ROLE-REGISTRY.json >/dev/null
          for f in schemas/*.json examples/*.json assessments/*.json tests/fixtures/adversarial/*.json; do python -m json.tool "$f" >/dev/null; done
      - name: Detect protected trust-root changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base"
          else
            base="$EVENT_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base SHA for this event."
            exit 0
          fi
          protected="$(git diff --name-only "$base" HEAD | python -c 'import json,sys; p=json.load(open("security/TRUST-ROOT-CHANGE.json")); print(chr(10).join(sorted(set(x.strip() for x in sys.stdin if x.strip()) & set(p["protectedPaths"]))))')"
          if [ -z "$protected" ]; then
            echo "No protected trust-root paths changed."
            exit 0
          fi
          record="$(git diff --name-only "$base" HEAD -- 'security/transitions/*.json' | tail -n 1)"
          if [ -z "$record" ]; then
            echo "Protected trust-root change has no transition record."
            printf '%s\n' "$protected"
            exit 1
          fi
          python src/tutela_trust_root.py --base "$base" --head HEAD --record "$record"
      - name: Set up .NET for authoritative F# implementation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Every project is in the solution
        # Prevention: a project that is not in Tutela.sln would silently escape
        # the build below (the F# CLI did, and never compiled).
        shell: bash
        run: |
          set -euo pipefail
          diff <(git ls-files '*.fsproj' '*.csproj' | sort) <(dotnet sln Tutela.sln list | tail -n +3 | tr '\\' '/' | sort)
      - name: Build all projects (warnings are errors)
        run: dotnet build Tutela.sln --configuration Release
      - name: Test F# gate authority (unit, exception approval, parity corpus, contract)
        run: dotnet run --project tests/Tutela.Core.Tests/Tutela.Core.Tests.fsproj --configuration Release --no-build
      - name: Test Python conformance oracle (migration bridge, docs/decisions/0001)
        run: |
          python -m unittest discover -s tests -v
          python tests/parity/generate_corpus.py --check
      - name: F# CLI end-to-end and differential against the oracle
        run: bash tests/cli/e2e.sh src/Tutela.Cli/bin/Release/net10.0/tutela.dll
      - name: Migration bridge expiry
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/tutela_gate.py ] && [ "$(date -u +%Y-%m-%d)" \> "2027-01-31" ]; then
            echo "The Python conformance bridge expired on 2027-01-31 (docs/decisions/0001-gate-authority.md)."
            echo "Retire src/tutela_gate.py or record a dated, owned extension of the decision."
            exit 1
          fi
      - name: Secret scan (Tutela sensitive-data catalog, TUTELA-SD-V*)
        run: dotnet src/Tutela.Cli/bin/Release/net10.0/tutela.dll scan-secrets --output /tmp/tutela-secret-scan.json
      - name: Requirement traceability (ratchet, tracked debt)
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/Tutela.Cli/bin/Release/net10.0/tutela.dll trace --output /tmp/tutela-traceability.json
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          r = json.load(open("/tmp/tutela-traceability.json"))
          print("### Tutela requirement traceability")
          print(f"- requirements: {r['requirementsTotal']}")
          print(f"- referenced by tests: {r['tracedByTests']}")
          print(f"- referenced in code only: {r['referencedInCodeOnly']}")
          print(f"- not referenced: {r['unreferenced']}")
          print(f"- untested: {r['untested']} (ratchet max {r['maxUntested']}, {r['status']})")
          PY
      - name: Set up Node.js for lifecycle smoke
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Conditor lifecycle surface
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          node bin/tutela.mjs init --root "$target"
          node bin/tutela.mjs verify --root "$target" --strict
          test -f "$target/.echelon/tutela.json"
          test -f "$target/.tutela/SECURITY-PROFILE.md"
          grep -q "echelon:tutela:start" "$target/AGENTS.md"
      - name: Verify the packed release archive (package.json, bin, CLI versions agree)
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(node bin/tutela.mjs --version)"
          if [ "$package_version" != "$cli_version" ]; then
            echo "package.json $package_version differs from the CLI VERSION $cli_version"
            exit 1
          fi
          pack_dir="$(mktemp -d)"
          npm pack --pack-destination "$pack_dir"
          archive="$(ls "$pack_dir"/*.tgz)"
          target="$(mktemp -d)"
          test "$(npm exec --yes --package="$archive" tutela -- --version)" = "$cli_version"
          npm exec --yes --package="$archive" tutela -- init --root "$target"
          npm exec --yes --package="$archive" tutela -- verify --strict --root "$target"
          test -f "$target/.tutela/schemas/exception.schema.json"
      - name: Project self-assessment presentation model
        run: |
          PYTHONPATH=src python src/tutela_present.py assessments/TUTELA-SELF-2026-0001.json > /tmp/tutela-self-view.json
          PYTHONPATH=src python src/tutela_render.py assessments/TUTELA-SELF-2026-0001.json /tmp/tutela-self-report.html
      - name: Verify example posture (F# gate authority)
        shell: bash
        run: |
          dotnet src/Tutela.Cli/bin/Release/net10.0/tutela.dll gate examples/security-assessment.json --check-declared \
            --output /tmp/tutela-example-verification.json || [ $? -eq 1 ]
      - name: Verify self-assessment postures (F# gate authority)
        shell: bash
        run: |
          for f in assessments/*.json; do
            dotnet src/Tutela.Cli/bin/Release/net10.0/tutela.dll gate "$f" --check-declared --output /dev/null || [ $? -eq 1 ] || exit 1
          done
      - name: Produce digest-bearing CI evidence artifacts
        env:
          SUBJECT_REF: ${{ github.sha }}
          RUN_REF: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python src/tutela_evidence.py src/Tutela.Core/Gate.fs \
            --id SEC-EVD-900 --type Test --source "Tutela deterministic gate (F# authority)" \
            --subject-ref "$SUBJECT_REF" --producer "GitHub Actions" \
            --producer-identity-type workflow --producer-identity-value tutela-foundation \
            --provenance-kind ci --provenance-issuer github-actions --run-ref "$RUN_REF" \
            --workflow-ref "$WORKFLOW_REF" --output /tmp/tutela-ci-evidence.json
          python src/tutela_evidence.py /tmp/tutela-secret-scan.json \
            --id SEC-EVD-901 --type SecretScan --source "tutela scan-secrets (tutela.secret-scan/1)" \
            --subject-ref "$SUBJECT_REF" --producer "GitHub Actions" \
            --producer-identity-type workflow --producer-identity-value tutela-foundation \
            --provenance-kind ci --provenance-issuer github-actions --run-ref "$RUN_REF" \
            --workflow-ref "$WORKFLOW_REF" --output /tmp/tutela-secret-scan-evidence.json
          python -m json.tool /tmp/tutela-ci-evidence.json >/dev/null
          python -m json.tool /tmp/tutela-secret-scan-evidence.json >/dev/null
          mkdir -p evidence/runs
          cp /tmp/tutela-ci-evidence.json evidence/runs/current-ci-evidence.json
      - name: Persist provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tutela-provenance-${{ github.sha }}
          path: |
            /tmp/tutela-ci-evidence.json
            /tmp/tutela-secret-scan.json
            /tmp/tutela-secret-scan-evidence.json
            /tmp/tutela-traceability.json
            /tmp/tutela-example-verification.json
            evidence/runs/current-ci-evidence.json
            /tmp/tutela-self-view.json
            /tmp/tutela-self-report.html
          if-no-files-found: error
          retention-days: 30
